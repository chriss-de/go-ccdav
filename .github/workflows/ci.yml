# Checks every push to main and every pull request, and builds the
# container image; version tags (v*) also publish it to Docker Hub.
#
# Setup (repository settings → Secrets and variables → Actions):
#   secret   DOCKERHUB_USERNAME    Docker Hub user
#   secret   DOCKERHUB_TOKEN       Docker Hub access token (Read & Write)
#   variable DOCKERHUB_REPOSITORY  image name without registry, e.g. chrissde/ccdav
#
# Image tags: git tag v1.2.3 → 1.2.3, 1.2, 1, latest (v0.x: no major tag).
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Latest patch release (stdlib security fixes); go.mod only sets
          # the minimum. Keep the minor in step with go.mod.
          go-version: "1.27.x"
          check-latest: true
      - name: gofmt
        run: make fmt-check
      - name: vet
        run: make vet
      - name: test (race detector)
        run: make race
      - name: govulncheck
        run: make vulncheck
      - name: build
        run: make build

  image:
    needs: check
    runs-on: ubuntu-latest
    env:
      PUSH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags, for the version string
      - name: image name
        id: name
        run: |
          repo="${{ vars.DOCKERHUB_REPOSITORY }}"
          if [ -z "$repo" ]; then
            if [ "$PUSH" = true ]; then
              echo "::error::set the repository variable DOCKERHUB_REPOSITORY (e.g. chrissde/ccdav)"; exit 1
            fi
            repo=local/ccdav # branches and pull requests only build
          fi
          echo "image=docker.io/$repo" >> "$GITHUB_OUTPUT"
          echo "version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
          labels: |
            org.opencontainers.image.title=ccdav
            org.opencontainers.image.description=Self-hosted CalDAV/CardDAV server
      - uses: docker/setup-qemu-action@v4 # only for the distroless base layers; Go cross-compiles
      - uses: docker/setup-buildx-action@v4
      - if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.name.outputs.version }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
