{{define "login.html"}}{{template "head"}}
<main class="login">
  <section>
    <h2>ccdav</h2>
    <p class="muted">Calendars and contacts. Sign in to manage your collections, sharing and device passwords.</p>
    {{if .Error}}<div class="flash err">{{.Error}}</div>{{end}}
    {{if .OIDC}}
      <form method="get" action="{{.Prefix}}login"><button type="submit">Sign in with {{.Provider}}</button></form>
    {{else}}
      <form method="post" action="{{.Prefix}}login">
        <input type="hidden" name="login" value="{{.Token}}">
        <label class="stack">User name<input type="text" name="user" autocomplete="username" required autofocus></label>
        <label class="stack">Password<input type="password" name="password" autocomplete="current-password" required></label>
        <button type="submit">Sign in</button>
      </form>
    {{end}}
  </section>
</main>
</body></html>
{{end}}
